
{% extends "base.html" %}
{% block title %}Edit Task{% endblock %}
{% block content %}
<div class="card" style="max-width:650px;margin:auto">
<h1>Edit Task</h1>
{% if error %}<p class="error">{{ error }}</p>{% endif %}
<form action="/tasks/{{ task.id }}/edit" method="post">
<label>Task Title</label>
<input name="title" value="{{ task.title }}" maxlength="200" required>
<label>Description</label>
<textarea name="description" maxlength="500" rows="4">{{ task.description or "" }}</textarea>
<label>Priority</label>
<select name="priority">
<option value="Low" {% if task.priority == "Low" %}selected{% endif %}>Low</option>
<option value="Medium" {% if task.priority == "Medium" %}selected{% endif %}>Medium</option>
<option value="High" {% if task.priority == "High" %}selected{% endif %}>High</option>
</select>
<label>Due Date (optional)</label>
<input type="date" name="due_date" value="{{ task.due_date.isoformat() if task.due_date else '' }}">
<button type="submit">Update Task</button>
<a class="btn" href="/dashboard">Cancel</a>
</form>
</div>
{% endblock %}
